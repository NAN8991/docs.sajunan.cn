<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="CTF 终端插画">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="0.55" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.28" />
    </filter>
  </defs>

  <circle cx="220" cy="210" r="150" fill="url(#glow)" opacity="0.12" />

  <g filter="url(#shadow)">
    <rect x="24" y="96" width="392" height="268" rx="20" fill="url(#screen)" stroke="#1f2937" stroke-width="2" />
    <path d="M24 132h392" stroke="#1f2937" stroke-width="2" />
    <circle cx="52" cy="114" r="6" fill="#ef4444" />
    <circle cx="74" cy="114" r="6" fill="#f59e0b" />
    <circle cx="96" cy="114" r="6" fill="#22c55e" />
    <text x="220" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">ctf — bash</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="52" y="174" fill="#22c55e">$</text>
      <text x="72" y="174" fill="#e2e8f0">whoami</text>
      <text x="52" y="204" fill="#94a3b8">ctf-newbie</text>

      <text x="52" y="240" fill="#22c55e">$</text>
      <text x="72" y="240" fill="#e2e8f0">ls categories/</text>
      <text x="52" y="270" fill="#60a5fa">crypto  web  pwn</text>
      <text x="52" y="294" fill="#a78bfa">reverse  misc  forensics</text>

      <text x="52" y="330" fill="#22c55e">$</text>
      <text x="72" y="330" fill="#e2e8f0">./start.sh</text>
    </g>

    <rect x="52" y="342" width="336" height="2" rx="1" fill="#1e293b" />
  </g>

  <g transform="translate(292 58)">
    <rect x="0" y="0" width="112" height="40" rx="20" fill="#0b1220" stroke="url(#glow)" stroke-width="2" />
    <circle cx="22" cy="20" r="6" fill="#22c55e" />
    <text x="38" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">
      ONLINE
    </text>
  </g>

  <g transform="translate(28 330)">
    <rect x="0" y="0" width="196" height="40" rx="20" fill="#0b1220" stroke="#1f2937" stroke-width="2" />
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#fbbf24">
